name: Extract JFOURCE Project

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -o JFOURCE_PPPoE_Android_CloudBuild.zip -d extracted
          cp -R extracted/JFOURCE_PPPoE_Android_Sample/. .
          rm -rf extracted
          rm -f JFOURCE_PPPoE_Android_CloudBuild.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract JFOURCE Android project" || echo "Nothing to commit"
          git push
